[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 5000
  metric_buffer_limit = 100000
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "opentwins"
  bucket = "default"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["opentwins/twin/events/#"]
  qos = 1
  data_format = "value"
  data_type = "string"
  name_override = "ditto_scalar"

[[processors.starlark]]
  namepass = ["ditto_scalar"]
  script = "/etc/telegraf/ditto_scalar.star"
