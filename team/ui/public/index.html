<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт смены — цифровой двойник рудника (синтетические данные)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/scheme.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/compare.css">
<link rel="stylesheet" href="css/scene3d.css">
<link rel="stylesheet" href="css/decide.css">
<link rel="stylesheet" href="css/poster.css">
<script type="importmap">{"imports": {"three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/"}}</script>
</head>
<body data-boot="loading" data-link="ok" data-publications="unknown" data-snapshot="none" data-commands="blocked"
      data-view="scheme" data-situation="none" data-panel="none" data-rail="open" data-menu="none" data-sheet="closed"
      data-stand="closed">
<noscript><p class="noscript">Интерфейсу нужен JavaScript. Синтетические данные. Расчёт модели, не сведения о реальной шахте</p></noscript>
<div class="app" id="app">
  <header class="topbar" id="statusbar"></header>

  <div class="frame" id="frame">
    <aside class="rail" id="rail-region">
      <div class="rail__body" id="rail" data-testid="rail"></div>
      <div class="legend" id="legend" data-testid="legend"></div>
    </aside>

    <main class="centre" id="centre">
      <div class="notices">
        <div class="banners" id="banners"></div>
        <div class="old-data" id="old-data" hidden></div>
      </div>
      <div class="centre__bar headline" id="headline"></div>
      <nav class="centre__bar hz" id="horizons"></nav>
      <section class="view view--scheme" id="view-scheme" data-view="scheme">
        <div class="stage" id="stage" data-testid="stage">
          <div class="stage__3d" id="stage-3d" data-testid="scene3d"></div>
          <div class="scheme" id="scheme" data-testid="scheme"></div>
          <div class="stage__hud" id="stage-hud"></div>
        </div>
        <div class="scheme-controls" id="scheme-controls"></div>
      </section>
      <section class="sheet" id="sheet" data-testid="card"></section>
      <div class="toasts" id="pending" data-testid="pending-area"></div>

      <aside class="stand" id="stand-drawer" data-testid="stand-drawer">
        <div class="stand__head" id="stand-head"></div>
        <div class="stand__body">
          <section class="stand__part" id="conditions" data-testid="conditions-panel"></section>
          <section class="stand__part stand__part--reset" id="reset"></section>
        </div>
      </aside>
    </main>

    <aside class="panel" id="panel" data-testid="panel"></aside>

    <section class="menu-view" id="menu-view" data-testid="menu-view" hidden>
      <div class="menu-view__bar" id="menu-bar"></div>
      <div class="menu-view__body">
        <section class="view view--list" id="view-list" data-view="list" data-testid="list" hidden></section>
        <section class="view view--runs" id="view-runs" data-view="runs" hidden></section>
        <section class="view view--journal" id="view-journal" data-view="journal" hidden>
          <div class="journal" id="journal" data-testid="journal"></div>
        </section>
      </div>
    </section>
  </div>
</div>
<div id="dialog-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
